global:
  # 5s, not the 15s default: the SLO is a 2 s p95, and a scrape interval three
  # times the budget cannot show a breach that lasts less than a minute.
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    stack: edgesense

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: edge-agent
    static_configs:
      - targets: ['edge-agent:9101']
        labels: { component: edge }

  - job_name: ingest
    static_configs:
      - targets: ['ingest:9102']
        labels: { component: ingest }

  - job_name: worker
    static_configs:
      - targets: ['worker:9103']
        labels: { component: worker }

  - job_name: sink
    static_configs:
      - targets: ['sink:9104']
        labels: { component: sink }

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels: { component: collector }

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels: { component: kafka }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
