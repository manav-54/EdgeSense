[project]
name = "edgesense-core"
version = "0.1.0"
description = "Shared wire contracts for EdgeSense services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["edgesense_core"]
